<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>即梦 · 开始创作</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%230f1014%22/><path d=%22M19 16l18 28 43 11-38 5-22 24 14-29z%22 fill=%22%2345d5d7%22/></svg>">
<style>
:root {
  --bg: #0c0d10; --rail: #101116; --panel: #15161b; --panel-2: #1a1b21; --panel-3: #202128;
  --line: rgba(255,255,255,.075); --line-strong: rgba(255,255,255,.13);
  --text: #f0f1f4; --text-2: #a1a4ad; --text-3: #6e727c;
  --cyan: #54d5d9; --cyan-soft: rgba(84,213,217,.12); --purple: #a58bff;
  --green: #51d88a; --yellow: #f0bf58; --red: #fa7373;
  --shadow: 0 14px 42px rgba(0,0,0,.36); --r: 13px; --r-sm: 9px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}
button,input,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}

.app{height:100%;display:grid;grid-template-columns:56px 236px minmax(0,1fr)}
.app.locked{visibility:hidden}
.auth-screen{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:24px;background:radial-gradient(800px 500px at 50% 0%,rgba(84,213,217,.12),transparent 60%),#0c0d10}
.auth-card{width:min(380px,100%);padding:30px;border:1px solid var(--line-strong);border-radius:20px;background:linear-gradient(145deg,rgba(30,32,40,.98),rgba(18,19,24,.99));box-shadow:0 24px 80px rgba(0,0,0,.5)}
.auth-brand{display:flex;align-items:center;gap:10px;color:var(--text-2);font-size:13px;margin-bottom:22px}
.auth-mark{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--purple));color:#071012;font-weight:800}
.auth-card h1{margin:0 0 8px;font-size:24px;letter-spacing:-.03em}
.auth-card p{margin:0 0 20px;color:var(--text-3);line-height:1.6;font-size:12px}
.auth-form{display:flex;gap:8px}
.auth-input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-2);padding:11px 12px;outline:none}
.auth-input:focus{border-color:var(--cyan)}
.auth-submit{border:0;border-radius:9px;padding:0 16px;background:var(--cyan);color:#071012;font-weight:650;cursor:pointer}
.auth-submit:disabled{opacity:.5;cursor:not-allowed}
.auth-error{min-height:18px;margin-top:10px;color:var(--red);font-size:11px}
.auth-hint{margin-top:16px;color:var(--text-3);font-size:10px}
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0 11px;gap:13px}
.brand-mark{width:28px;height:28px;display:grid;place-items:center;margin-bottom:7px}
.rail-nav{display:flex;flex-direction:column;gap:5px;width:100%;align-items:center}
.rail-btn{width:43px;height:42px;border:0;border-radius:10px;background:transparent;color:var(--text-3);display:grid;place-items:center;cursor:pointer;transition:.16s}
.rail-btn svg{width:19px;height:19px}
.rail-btn span{display:block;font-size:10px;margin-top:2px}
.rail-btn:hover{background:var(--panel-2);color:var(--text)}
.rail-btn.active{color:var(--text);background:rgba(255,255,255,.08)}
.rail-spacer{flex:1}
.rail-badge{width:42px;padding:7px 2px;border:1px solid rgba(84,213,217,.26);border-radius:10px;background:var(--cyan-soft);color:var(--cyan);text-align:center;font-size:9px;line-height:1.35}
.rail-avatar{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#e86f9d,#7c73f7);display:grid;place-items:center;font-size:11px}

.sessions{background:#131419;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.sessions-head{display:flex;align-items:center;justify-content:space-between;padding:17px 14px 12px}
.sessions-title{font-size:14px;font-weight:600}
.icon-btn{border:0;width:28px;height:28px;display:grid;place-items:center;color:var(--text-2);background:transparent;border-radius:7px;cursor:pointer}
.icon-btn:hover{background:var(--panel-3);color:var(--text)}
.new-chat{margin:0 11px 13px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel-2);padding:9px 11px;display:flex;align-items:center;gap:8px;color:var(--text-2);cursor:pointer}
.new-chat:hover{color:var(--text);border-color:rgba(255,255,255,.22);background:var(--panel-3)}
.session-caption{padding:4px 14px 7px;color:var(--text-3);font-size:11px}
.session-list{flex:1;overflow:auto;padding:0 8px 14px}
.session{display:flex;gap:8px;align-items:center;padding:7px 7px;border-radius:8px;cursor:pointer;color:var(--text-2);min-width:0}
.session:hover{background:rgba(255,255,255,.055);color:var(--text)}
.session.active{background:rgba(255,255,255,.09);color:var(--text)}
.session-thumb{width:28px;height:28px;border-radius:6px;object-fit:cover;background:var(--panel-3);flex:0 0 auto}
.session-thumb.empty{display:grid;place-items:center;color:var(--text-3);font-size:12px}
.session-name{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:11px}
.session-count{margin-left:auto;color:var(--text-3);font-size:9px}

.workspace{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.topbar{height:54px;min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:flex-end;padding:0 22px;gap:7px}
.top-filter{border:0;border-radius:8px;background:rgba(255,255,255,.055);color:var(--text-2);padding:8px 10px;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:11px}
.top-filter:hover{color:var(--text);background:rgba(255,255,255,.1)}
.connection{display:flex;align-items:center;gap:6px;margin-left:9px;color:var(--text-3);font-size:10px}
.connection-dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.connection-dot.off{background:var(--red)}

.feed-wrap{flex:1;overflow:auto;position:relative;scroll-padding-bottom:170px}
.feed{width:min(760px,calc(100% - 64px));margin:0 auto;padding:28px 0 210px}
.feed-empty{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-2)}
.feed-empty strong{font-size:18px;font-weight:600;color:var(--text)}
.feed-empty span{margin-top:7px;color:var(--text-3);font-size:12px}

.message{margin-bottom:29px;animation:msgIn .24s ease-out}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.message-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.message-avatar{width:28px;height:28px;border-radius:8px;background:var(--panel-3);color:var(--text-2);display:grid;place-items:center;flex:0 0 auto}
.message-copy{flex:1;min-width:0}
.message-prompt{color:var(--text);line-height:1.65;white-space:pre-wrap;word-break:break-word}
.message-meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;color:var(--text-3);font-size:10px}
.message-meta b{color:var(--text-2);font-weight:500}
.message-actions{margin-left:auto;display:flex;gap:4px;opacity:.72}
.message-actions button{border:0;background:transparent;color:var(--text-2);width:25px;height:25px;border-radius:6px;cursor:pointer}
.message-actions button:hover{background:var(--panel-2);color:var(--text)}
.asset{margin-left:38px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#101115;box-shadow:var(--shadow);position:relative}
.asset img,.asset video{display:block;width:100%;max-height:530px;object-fit:contain;background:#090a0d}
.asset-grid{display:grid;gap:3px;grid-template-columns:1fr 1fr}
.asset-grid.two{grid-template-columns:1fr 1fr}
.asset-grid.four{grid-template-columns:1fr 1fr}
.asset-grid img{width:100%;aspect-ratio:auto;object-fit:contain;background:#090a0d}
.asset-placeholder{height:220px;display:grid;place-items:center;color:var(--text-3)}
.asset-placeholder .loader{width:29px;height:29px;border:2px solid rgba(255,255,255,.15);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}
.asset-placeholder p{margin:10px 0 0;font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}
.asset-footer{display:flex;align-items:center;gap:8px;padding:9px 10px;color:var(--text-3);font-size:10px}
.asset-footer .asset-status{display:flex;align-items:center;gap:5px}
.asset-status .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.asset-status.processing .dot{background:var(--cyan);animation:pending 1.2s infinite}
@keyframes pending{50%{opacity:.35}}
.asset-footer .spacer{flex:1}
.asset-footer button{border:0;background:transparent;color:var(--text-2);cursor:pointer;padding:4px 7px;border-radius:6px}
.asset-footer button:hover{background:var(--panel-2);color:var(--text)}

.composer-dock{position:fixed;left:292px;right:26px;bottom:18px;z-index:5;pointer-events:none}
.composer{pointer-events:auto;width:min(760px,calc(100% - 64px));margin:0 auto;background:linear-gradient(160deg,rgba(37,38,46,.97),rgba(24,25,31,.98));border:1px solid rgba(255,255,255,.13);border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.47);padding:12px 13px 10px}
.composer-main{display:flex;align-items:flex-start;gap:10px}
.upload-btn{width:38px;height:42px;border:1px dashed rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.035);color:var(--text-3);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.upload-btn:hover{color:var(--text);border-color:var(--cyan)}
.upload-zone{position:relative;width:100%;border:1px dashed transparent;border-radius:11px;transition:.16s}
.upload-zone.drag-over{border-color:var(--cyan);background:var(--cyan-soft);box-shadow:0 0 0 4px rgba(84,213,217,.08)}
.upload-zone.drag-over::after{content:'松开即可添加素材';position:absolute;inset:0;display:grid;place-items:center;border-radius:10px;background:rgba(12,13,16,.84);color:var(--cyan);font-size:12px;pointer-events:none}
.material-strip{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 8px 48px;max-height:74px;overflow:auto}
.material-chip{position:relative;display:flex;align-items:center;gap:6px;max-width:210px;padding:5px 23px 5px 6px;border:1px solid var(--line-strong);border-radius:8px;background:rgba(255,255,255,.055);color:var(--text-2);font-size:10px}
.material-chip img,.material-chip video{width:28px;height:28px;object-fit:cover;border-radius:5px;background:#090a0d}
.material-chip audio{width:116px;height:27px}
.material-kind{width:28px;height:28px;display:grid;place-items:center;border-radius:5px;background:var(--panel-3);color:var(--cyan);font-size:12px}
.material-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.material-remove{position:absolute;right:3px;top:3px;border:0;background:transparent;color:var(--text-3);cursor:pointer;font-size:14px;line-height:16px}
.material-remove:hover{color:var(--red)}
.upload-hint{color:var(--text-3);font-size:10px;margin:0 0 8px 48px}
.prompt-box{flex:1;min-width:0}
.prompt-input{width:100%;min-height:44px;max-height:130px;resize:none;color:var(--text);background:transparent;border:0;outline:none;line-height:1.55;padding:3px 0}
.prompt-input::placeholder{color:#777b86}
.prompt-hint{display:flex;justify-content:space-between;color:var(--text-3);font-size:10px;margin-top:5px}
.composer-controls{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:10px}
.control{display:flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.08);color:var(--text-2);background:rgba(255,255,255,.04);border-radius:8px;padding:7px 9px;cursor:pointer;font-size:10px}
.control:hover{color:var(--text);background:rgba(255,255,255,.08)}
.control select{border:0;outline:0;background:transparent;color:inherit;font-size:10px;cursor:pointer;max-width:150px}
.control select option{background:#22232a}
.composer-end{margin-left:auto;display:flex;align-items:center;gap:8px}
.send-btn{width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:50%;background:#3b3e48;color:#9fa4b0;cursor:pointer;transition:.15s}
.send-btn.ready{background:var(--cyan);color:#071012}
.send-btn:hover{transform:translateY(-1px)}
.send-btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);opacity:0;pointer-events:none;transition:.2s;z-index:30;border:1px solid var(--line-strong);border-radius:9px;padding:9px 13px;background:var(--panel-3);color:var(--text);box-shadow:var(--shadow);font-size:12px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{color:var(--red);border-color:rgba(250,115,115,.32)}
.toast.success{color:var(--green);border-color:rgba(51,216,138,.32)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:40;display:grid;place-items:center;padding:30px}
.modal-inner{max-width:min(1000px,92vw);max-height:90vh;position:relative}
.modal-inner img,.modal-inner video{max-width:92vw;max-height:86vh;display:block;border-radius:12px;background:#08090c}
.modal-close{position:absolute;right:-42px;top:-42px;width:32px;height:32px;border:0;border-radius:50%;background:rgba(255,255,255,.13);color:#fff;font-size:21px;cursor:pointer}
.modal-close:hover{background:rgba(255,255,255,.23)}

@media(max-width:900px){.app{grid-template-columns:56px minmax(0,1fr)}.sessions{display:none}.composer-dock{left:72px;right:12px}}
@media(max-width:600px){.rail{display:none}.app{display:block}.workspace{height:100%}.topbar{padding:0 12px}.feed{width:calc(100% - 24px);padding-top:18px}.asset{margin-left:0}.composer-dock{left:10px;right:10px;bottom:10px}.composer{width:100%}}
</style>
</head>
<body>
<div class="app locked" id="app">
  <aside class="rail">
    <div class="brand-mark"><svg viewBox="0 0 32 32" fill="none"><path d="M5 4l7 11 16 4-14 2-8 9 5-11z" fill="#54d5d9"/><path d="M12 15l6 2-5 1z" fill="#a58bff"/></svg></div>
    <nav class="rail-nav">
      <button type="button" class="rail-btn" data-rail="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 11.5L12 4l9 7.5"/><path d="M5 10v9h14v-9M9 19v-5h6v5"/></svg><span>灵感</span></button>
      <button type="button" class="rail-btn active" data-rail="generate"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.1 7.9L22 12l-7.9 2.1L12 22l-2.1-7.9L2 12l7.9-2.1z"/></svg><span>生成</span></button>
      <button type="button" class="rail-btn" data-rail="assets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h16v13H4zM7 4h10v3H7z"/><path d="M8 11h8M8 15h5"/></svg><span>资产</span></button>
      <button type="button" class="rail-btn" data-rail="canvas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16v14H4zM8 5v14M16 5v14M4 10h16M4 15h16"/></svg><span>画布</span></button>
    </nav>
    <div class="rail-spacer"></div>
    <div class="rail-badge">会员分析<br><b>1.5万</b></div>
    <button type="button" class="rail-btn" title="通知"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
    <div class="rail-avatar">梦</div>
  </aside>
  <aside class="sessions" id="sessionsPanel">
    <div class="sessions-head"><span class="sessions-title">开始创作</span><button type="button" class="icon-btn" id="collapseSessions" title="收起侧栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 5v14"/></svg></button></div>
    <button type="button" class="new-chat" id="newChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>新对话</button>
    <div class="session-caption">最近</div>
    <div class="session-list" id="sessionList"><div class="session active" data-session-id="default"><div class="session-thumb empty">✦</div><span class="session-name">默认会话</span></div></div>
  </aside>
  <main class="workspace">
    <header class="topbar">
      <button type="button" class="top-filter" id="filterAll">全部</button>
      <button type="button" class="top-filter" id="filterCompleted">已完成</button>
      <button type="button" class="top-filter" id="filterProcessing">生成中</button>
      <div class="connection"><span class="connection-dot" id="connectionDot"></span><span id="connectionText">在线</span></div>
    </header>
    <section class="feed-wrap" id="feedWrap">
      <div class="feed" id="feed">
        <div class="feed-empty" id="feedEmpty">
          <strong>灵感即刻成片</strong><span>输入一段描述，生成图片或视频</span>
          <button type="button" id="examplePrompt" style="margin-top:18px;border:1px solid var(--line-strong);background:var(--panel-2);color:var(--text-2);border-radius:8px;padding:8px 13px;cursor:pointer">试试示例提示词</button>
        </div>
      </div>
    </section>
  </main>
</div>
<div class="composer-dock">
  <section class="composer" aria-label="创作输入区">
    <div class="upload-zone" id="uploadZone">
      <div class="material-strip" id="materialStrip"></div>
      <div class="upload-hint" id="uploadHint">可拖入或点击添加图片、视频、音频素材（最多 12 个，单个不超过 80MB）</div>
      <div class="composer-main">
        <button type="button" class="upload-btn" id="uploadBtn" title="添加素材"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/><rect x="4" y="4" width="16" height="16" rx="3"/></svg><input id="fileInput" type="file" accept="image/*,video/*,audio/*" multiple hidden></button>
        <div class="prompt-box">
          <textarea id="promptInput" class="prompt-input" maxlength="2000" placeholder="输入文字描述你想要的画面，或把素材拖到这里..."></textarea>
          <div class="prompt-hint"><span>中文创作，描述越具体效果越好</span><span id="charCount">0/2000 · ⌘↵ 生成</span></div>
        </div>
      </div>
    </div>
    <div class="composer-controls">
      <div class="control"><select id="modeSelect"><option value="image">图片生成</option><option value="video">视频生成</option></select></div>
      <div class="control"><select id="modelSelect"></select></div>
      <div class="control"><select id="ratioSelect"></select></div>
      <div class="control"><select id="resSelect"></select></div>
      <div class="control" id="durationControl"><select id="durationSelect"><option value="5">5s</option><option value="6">6s</option><option value="8">8s</option><option value="10">10s</option></select></div>
      <div class="composer-end"><span class="char-count" id="creditHint">积分按实际生成扣除</span><button type="button" class="send-btn" id="sendBtn" disabled title="开始生成"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button></div>
    </div>
  </section>
</div>
<div class="auth-screen" id="authScreen">
  <div class="auth-card">
    <div class="auth-brand"><span class="auth-mark">✦</span><span>即梦中转站</span></div>
    <h1>输入访问密码</h1>
    <p>这是一个受保护的创作空间，请输入密码后继续使用。</p>
    <form class="auth-form" id="authForm">
      <input class="auth-input" id="authPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="访问密码" maxlength="64" autofocus>
      <button class="auth-submit" id="authSubmit" type="submit">进入</button>
    </form>
    <div class="auth-error" id="authError" aria-live="polite"></div>
    <div class="auth-hint">密码验证通过后会在当前浏览器保持 7 天。</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  const q=new URLSearchParams(location.search);const fromUrl=q.get('api');
  try{if(fromUrl)localStorage.setItem('jimeng_api_base',fromUrl.replace(/\/+$/,''));window.API_BASE=(localStorage.getItem('jimeng_api_base')||'').replace(/\/+$/,'')}catch(e){window.API_BASE=fromUrl||''}
})();
const $=id=>document.getElementById(id);
const IMG_MODELS=[{id:'jimeng-5.0',label:'Seedream 5.0'},{id:'jimeng-4.5',label:'Seedream 4.5'},{id:'jimeng-4.1',label:'Seedream 4.1'},{id:'jimeng-4.0',label:'Seedream 4.0'}];
const VIDEO_MODELS=[{id:'jimeng-video-seedance-2.0-fast',label:'Seedance 2.0 fast'},{id:'jimeng-video-3.0-fast',label:'Seedance 3.0 mini'},{id:'jimeng-video-3.0-pro',label:'Seedance 3.0 pro'}];
const RATIOS={image:['1:1','16:9','9:16','4:3','3:4','21:9'],video:['16:9','9:16','1:1','4:3','3:4','21:9']};
const RES={image:['2k','4k'],video:['720p','1080p']};
let currentMode='video',selectedModel=VIDEO_MODELS[0].id,activeFilter='all',selectedSession='default';
let modeState={image:{model:IMG_MODELS[0].id,ratio:'1:1',res:'2k'},video:{model:VIDEO_MODELS[0].id,ratio:'16:9',res:'720p'}};
let tasksCache=new Map(),lastSignature='',pollTimer=null,healthTimer=null,refreshInFlight=false,toastTimer=null,authenticated=false,materials=[];

async function initAuth(){
  try{
    const r=await fetch('/api/auth/status',{cache:'no-store',credentials:'include'});const d=await r.json();
    if(d.authenticated){unlockApp();return}
  }catch(e){}
  $('authScreen').style.display='grid';$('app').classList.add('locked');$('authPassword').focus();
}
function unlockApp(){authenticated=true;$('authScreen').style.display='none';$('app').classList.remove('locked');renderSelects();refreshTasks();checkHealth()}
$('authForm').addEventListener('submit',async e=>{
  e.preventDefault();const btn=$('authSubmit');const error=$('authError');btn.disabled=true;error.textContent='';
  try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({password:$('authPassword').value})});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'密码不正确');$('authPassword').value='';unlockApp()}catch(err){error.textContent=err.message||'密码不正确';$('authPassword').select()}finally{btn.disabled=false}
});

function resolveUrl(url){if(!url)return'';if(/^https?:\/\//i.test(url))return url;const base=(window.API_BASE||location.origin).replace(/\/+$/,'');return url.startsWith('/')?base+url:base+'/'+url}
function escapeHtml(value){const d=document.createElement('div');d.textContent=String(value??'');return d.innerHTML}
function setToast(msg,type='info'){const t=$('toast');clearTimeout(toastTimer);t.textContent=msg;t.className='toast '+type+' show';toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
function setConnection(ok){$('connectionDot').classList.toggle('off',!ok);$('connectionText').textContent=ok?'在线':(window.API_BASE?'后端离线':'未连接后端')}

function renderSelects(){
  const video=currentMode==='video';const st=video?modeState.video:modeState.image;
  $('modelSelect').innerHTML=(video?VIDEO_MODELS:IMG_MODELS).map(m=>`<option value="${m.id}">${m.label}</option>`).join('');
  $('modelSelect').value=st.model;$('ratioSelect').innerHTML=RATIOS[video?'video':'image'].map(r=>`<option value="${r}">${r}</option>`).join('');$('ratioSelect').value=st.ratio;
  $('resSelect').innerHTML=RES[video?'video':'image'].map(r=>`<option value="${r}">${r}</option>`).join('');$('resSelect').value=st.res;
  $('durationControl').style.display=video?'':'none';$('modeSelect').value=video?'video':'image';
}

$('modeSelect').addEventListener('change',()=>{
  const old=currentMode;currentMode=$('modeSelect').value;
  modeState[old]={model:$('modelSelect').value,ratio:$('ratioSelect').value,res:$('resSelect').value};
  renderSelects();
});
$('modelSelect').addEventListener('change',e=>{const st=currentMode==='video'?modeState.video:modeState.image;st.model=e.target.value});
$('ratioSelect').addEventListener('change',e=>{const st=currentMode==='video'?modeState.video:modeState.image;st.ratio=e.target.value});
$('resSelect').addEventListener('change',e=>{const st=currentMode==='video'?modeState.video:modeState.image;st.res=e.target.value});

const promptInput=$('promptInput');
promptInput.addEventListener('input',()=>{$('charCount').textContent=`${promptInput.value.length}/2000 · ⌘↵ 生成`;$('sendBtn').disabled=!promptInput.value.trim();$('sendBtn').classList.toggle('ready',!!promptInput.value.trim())});
promptInput.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();submitTask()}});
$('sendBtn').addEventListener('click',submitTask);
$('newChat').addEventListener('click',()=>{selectedSession='session_'+Date.now();promptInput.value='';promptInput.dispatchEvent(new Event('input'));applyFilters();setToast('新对话已创建','success')});
$('examplePrompt').addEventListener('click',()=>{promptInput.value='电影质感，海边公路上的银色跑车沿着悬崖缓慢行驶，夕阳从海面洒下金色光线，镜头平稳跟拍，画面细节丰富';promptInput.dispatchEvent(new Event('input'))});
function materialIcon(item){return item.kind==='image'?'▧':item.kind==='video'?'▶':'♫'}
function renderMaterials(){
  const strip=$('materialStrip');
  strip.innerHTML=materials.map((item,index)=>{
    const media=item.kind==='image'?`<img src="${escapeHtml(resolveUrl(item.url))}" alt="">`:item.kind==='video'?`<video src="${escapeHtml(resolveUrl(item.url))}" muted preload="metadata"></video>`:item.kind==='audio'?`<audio src="${escapeHtml(resolveUrl(item.url))}" controls preload="metadata"></audio>`:`<span class="material-kind">${materialIcon(item)}</span>`;
    return `<div class="material-chip">${media}<span class="material-name" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</span><button type="button" class="material-remove" data-material-index="${index}" title="移除">×</button></div>`;
  }).join('');
  $('uploadHint').textContent=materials.length?`已添加 ${materials.length}/12 个素材，可继续拖入或点击添加`:'可拖入或点击添加图片、视频、音频素材（最多 12 个，单个不超过 80MB）';
}
function sendUploadChunk(form){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',`${window.API_BASE}/api/uploads/chunk`);xhr.withCredentials=true;xhr.upload.onprogress=e=>{if(e.lengthComputable){const pct=Math.round(e.loaded/e.total*100);$('uploadHint').textContent=`正在上传素材…本片段 ${pct}%`}};xhr.onload=()=>{try{const d=JSON.parse(xhr.responseText||'{}');if(xhr.status>=200&&xhr.status<300&&d.success)resolve(d);else reject(new Error(d.error||`上传失败（${xhr.status}）`))}catch(e){reject(new Error('上传响应无效'))}};xhr.onerror=()=>reject(new Error('网络连接中断'));xhr.ontimeout=()=>reject(new Error('上传超时'));xhr.timeout=30000;xhr.send(form)})}
async function uploadOneMaterial(file,fileIndex,fileCount){
  const chunkSize=384*1024,total=Math.max(1,Math.ceil(file.size/chunkSize));const uploadId=`${Date.now()}-${Math.random().toString(36).slice(2)}`;
  for(let index=0;index<total;index++){
    const start=index*chunkSize;const end=Math.min(file.size,start+chunkSize);const form=new FormData();form.append('chunk',file.slice(start,end),file.name);form.append('upload_id',uploadId);form.append('index',String(index));form.append('total',String(total));form.append('name',file.name);form.append('mime',file.type);
    let lastError=null;for(let attempt=0;attempt<3;attempt++){try{const result=await sendUploadChunk(form);if(result.complete)return result.file;lastError=null;break}catch(e){lastError=e;await new Promise(r=>setTimeout(r,400*(attempt+1)))}}if(lastError)throw lastError;
    $('uploadHint').textContent=`正在上传素材…${fileIndex+1}/${fileCount}，第 ${index+1}/${total} 片`;
  }
  throw new Error('素材分片未完成');
}
async function uploadMaterials(fileList){
  const incoming=Array.from(fileList||[]);if(!incoming.length)return;
  const available=12-materials.length;if(incoming.length>available){setToast(`最多添加 12 个素材，已忽略多余文件`,'error');incoming.splice(available)}
  const invalid=incoming.filter(file=>!/^(image|video|audio)\//i.test(file.type)||file.size>80*1024*1024);
  if(invalid.length){setToast('仅支持图片、视频、音频，单个文件不超过 80MB','error');return}
  try{
    const uploaded=[];for(let i=0;i<incoming.length;i++){uploaded.push(await uploadOneMaterial(incoming[i],i,incoming.length))}
    materials.push(...uploaded);renderMaterials();setToast(`已添加 ${uploaded.length} 个素材`,'success');
  }catch(e){renderMaterials();setToast(e.message||'素材上传失败','error')}
}
$('uploadBtn').addEventListener('click',()=>$('fileInput').click());
$('fileInput').addEventListener('change',e=>{uploadMaterials(e.target.files);e.target.value='' });
const uploadZone=$('uploadZone');
['dragenter','dragover'].forEach(type=>uploadZone.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();uploadZone.classList.add('drag-over')}));
['dragleave','drop'].forEach(type=>uploadZone.addEventListener(type,e=>{e.preventDefault();e.stopPropagation();if(type==='dragleave'&&e.relatedTarget&&uploadZone.contains(e.relatedTarget))return;uploadZone.classList.remove('drag-over')}));
uploadZone.addEventListener('drop',e=>uploadMaterials(e.dataTransfer.files));
document.addEventListener('paste',e=>{const files=Array.from(e.clipboardData?.files||[]);if(files.length)uploadMaterials(files)});
$('materialStrip').addEventListener('click',e=>{const btn=e.target.closest('[data-material-index]');if(!btn)return;materials.splice(Number(btn.dataset.materialIndex),1);renderMaterials()});
$('collapseSessions').addEventListener('click',()=>{const p=$('sessionsPanel');p.style.display=p.style.display==='none'?'':'none';setToast(p.style.display==='none'?'侧栏已收起':'侧栏已展开','info')});

$('filterAll').addEventListener('click',()=>{activeFilter='all';applyFilters()});
$('filterCompleted').addEventListener('click',()=>{activeFilter='completed';applyFilters()});
$('filterProcessing').addEventListener('click',()=>{activeFilter='processing';applyFilters()});
document.querySelectorAll('.rail-btn[data-rail]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.rail-btn[data-rail]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');if(btn.dataset.rail!=='generate')setToast('该区域正在准备中','info')}));

function buildSessions(tasks){
  const sessions=new Map();
  for(const t of tasks){
    const sid=t.session_id||'default';
    if(!sessions.has(sid))sessions.set(sid,{id:sid,tasks:[],lastTask:t,thumbUrl:''});
    const s=sessions.get(sid);s.tasks.push(t);
    if(t.created_at>s.lastTask.created_at)s.lastTask=t;
    if(!s.thumbUrl&&t.output_url&&t.type==='image')s.thumbUrl=resolveUrl(t.output_url.split(',')[0]);
  }
  const list=$('sessionList');
  const items=Array.from(sessions.values()).sort((a,b)=>new Date(b.lastTask.created_at)-new Date(a.lastTask.created_at)).slice(0,30);
  list.innerHTML=items.map(s=>{
    const active=s.id===selectedSession?' active':'';
    const thumb=s.thumbUrl?`<img class="session-thumb" src="${escapeHtml(s.thumbUrl)}" alt="">`:`<div class="session-thumb empty">✦</div>`;
    return `<div class="session${active}" data-session-id="${escapeHtml(s.id)}">${thumb}<span class="session-name">${escapeHtml(s.lastTask.prompt.slice(0,18))||'默认会话'}</span><span class="session-count">${s.tasks.length}</span></div>`;
  }).join('');
}
function applyFilters(){
  let tasks=Array.from(tasksCache.values()).filter(t=>(t.session_id||'default')===selectedSession);
  if(activeFilter==='completed')tasks=tasks.filter(t=>t.status==='completed');
  else if(activeFilter==='processing')tasks=tasks.filter(t=>t.status==='pending'||t.status==='processing');
  tasks.sort((a,b)=>Number(a.id)-Number(b.id));
  renderFeed(tasks);buildSessions(Array.from(tasksCache.values()));
}
function renderFeed(tasks){
  const feed=$('feed');
  if(!tasks.length){feed.innerHTML=`<div class="feed-empty"><strong>${activeFilter==='processing'?'暂无生成中的任务':selectedSession==='default'?'灵感即刻成片':'当前会话暂无内容'}</strong><span>${activeFilter==='processing'?'任务完成后会自动出现在这里':'输入一段描述，开始创作'}</span></div>`;return}
  feed.innerHTML=tasks.map(task=>{
    const isVideo=task.type==='video',active=task.status==='pending'||task.status==='processing';
    const urls=(task.output_url||'').split(',').filter(Boolean);
    const meta=`${task.model||''} · ${task.duration?task.duration+'s · ':''}${task.ratio||''} · ${task.resolution||''}`;
    let asset='';
    if(active)asset=`<div class="asset-placeholder"><div><div class="loader"></div><p>${task.status==='pending'?'排队中，等待生成':'正在生成，请稍候'}</p></div></div>`;
    else if(task.status==='failed')asset=`<div class="asset-placeholder" style="color:var(--red);"><div><div style="font-size:24px;text-align:center;">×</div><p>生成失败 · ${escapeHtml(task.error_message||'服务暂时繁忙')}</p></div></div>`;
    else if(isVideo&&urls[0])asset=`<video data-preview-url="${escapeHtml(resolveUrl(urls[0]))}" src="${escapeHtml(resolveUrl(urls[0]))}" controls preload="none" playsinline></video>`;
    else if(urls.length>1)asset=`<div class="asset-grid ${urls.length>=4?'four':'two'}">${urls.map(u=>`<img data-preview-url="${escapeHtml(resolveUrl(u))}" src="${escapeHtml(resolveUrl(u))}" loading="lazy" alt="">`).join('')}</div>`;
    else if(urls[0])asset=`<img data-preview-url="${escapeHtml(resolveUrl(urls[0]))}" src="${escapeHtml(resolveUrl(urls[0]))}" loading="lazy" alt="">`;
    else asset=`<div class="asset-placeholder"><p>暂无可预览结果</p></div>`;
    return `<article class="message" data-task-id="${task.id}"><div class="message-head"><div class="message-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2 6h6l-5 4 2 6-5-3.5L7 19l2-6-5-4h6z"/></svg></div><div class="message-copy"><div class="message-prompt">${escapeHtml(task.prompt)}</div><div class="message-meta"><b>${isVideo?'视频生成':'图片生成'}</b><span>·</span><span>${escapeHtml(meta)}</span><span>·</span><span>${formatTime(task.created_at)}</span></div></div><div class="message-actions"><button type="button" data-action="retry">↻</button></div></div><div class="asset" data-asset-id="${task.id}">${asset}<div class="asset-footer"><span class="asset-status ${active?'processing':''}"><span class="dot"></span>${task.status==='completed'?'已完成':task.status==='failed'?'失败':task.status==='pending'?'排队中':'生成中'}</span><span class="spacer"></span>${urls.length?`<button type="button" data-action="download">下载</button>`:''}<button type="button" data-action="retry">再次生成</button></div></div></article>`;
  }).join('');
}
function formatTime(dateText){const raw=String(dateText||'').trim();if(!raw)return'';const normalized=raw.includes('T')?raw:raw.replace(' ','T');const hasZone=/Z$|[+-]\d{2}:?\d{2}$/.test(normalized);const d=new Date(hasZone?normalized:normalized+'Z');if(Number.isNaN(d.getTime()))return'';const diff=Math.max(0,Date.now()-d.getTime());if(diff<60000)return'刚刚';if(diff<3600000)return Math.floor(diff/60000)+'分钟前';if(diff<86400000)return Math.floor(diff/3600000)+'小时前';if(diff<172800000)return'昨天';return(d.getMonth()+1)+'月'+d.getDate()+'日'}

function taskSignature(tasks){return tasks.map(t=>`${t.id}|${t.status}|${t.output_url||''}|${t.error_message||''}|${t.session_id||''}`).join('~')}
async function refreshTasks(){
  if(!authenticated||refreshInFlight||document.hidden)return;refreshInFlight=true;
  try{const r=await fetch(`${window.API_BASE}/api/tasks?limit=200`,{cache:'no-store',credentials:'include'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const d=await r.json();const tasks=Array.isArray(d.tasks)?d.tasks:[];setConnection(true);const sig=taskSignature(tasks);if(sig!==lastSignature){lastSignature=sig;tasksCache=new Map(tasks.map(t=>[String(t.id),t]));applyFilters()}const active=tasks.some(t=>t.status==='pending'||t.status==='processing');schedulePolling(active?2600:12000)}catch(e){setConnection(false);schedulePolling(12000)}finally{refreshInFlight=false}
}
function schedulePolling(ms){clearTimeout(pollTimer);pollTimer=setTimeout(refreshTasks,ms)}
async function checkHealth(){try{const r=await fetch(`${window.API_BASE}/api/health`,{cache:'no-store'});setConnection(r.ok)}catch(e){setConnection(false)};healthTimer=setTimeout(checkHealth,20000)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshTasks()});

async function submitTask(){
  if(!authenticated){$('authPassword').focus();return}
  const prompt=promptInput.value.trim();if(!prompt){promptInput.focus();setToast('请输入提示词','error');return}
  const btn=$('sendBtn');btn.disabled=true;btn.classList.remove('ready');
  const st=currentMode==='video'?modeState.video:modeState.image;
  const payload={type:currentMode,prompt,model:st.model,ratio:st.ratio,resolution:st.res,duration:Number($('durationSelect').value),video_mode:materials.some(m=>m.kind==='video')?'omni_reference':materials.length?'image_to_video':'text_to_video',session_id:selectedSession,input_files:materials};
  try{const r=await fetch(`${window.API_BASE}/api/tasks`,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.success)throw new Error(d.error||'提交失败');promptInput.value='';promptInput.dispatchEvent(new Event('input'));materials=[];renderMaterials();setToast('已提交，结果会自动出现在当前对话','success');refreshTasks()}catch(e){setToast(e.message||'后端离线，请稍后重试','error');btn.disabled=false;btn.classList.add('ready')}
}
function loadTaskForRetry(task){
  if(!task)return;
  currentMode=task.type==='video'?'video':'image';
  const state=currentMode==='video'?modeState.video:modeState.image;
  state.model=task.model||state.model;state.ratio=task.ratio||state.ratio;state.res=task.resolution||state.res;
  renderSelects();
  if(currentMode==='video'&&task.duration)$('durationSelect').value=String(task.duration);
  promptInput.value=task.prompt||'';promptInput.dispatchEvent(new Event('input'));
  try{materials=JSON.parse(task.input_files||'[]').map(item=>typeof item==='string'?{name:item.split('/').pop(),kind:'image',mime:'image/*',url:item}:item).filter(item=>item.url)}catch(e){materials=[]}
  renderMaterials();promptInput.focus();setToast('已恢复原提示词、素材和生成模式，可直接再次生成','info');
}
function openModal(url,video){const modal=document.createElement('div');modal.className='modal';modal.innerHTML=`<div class="modal-inner"><button type="button" class="modal-close">×</button>${video?`<video src="${escapeHtml(url)}" controls autoplay playsinline></video>`:`<img src="${escapeHtml(url)}" alt="">`}</div>`;const close=()=>{modal.querySelector('video')?.pause();modal.remove();document.removeEventListener('keydown',esc)};const esc=e=>{if(e.key==='Escape')close()};modal.addEventListener('click',e=>{if(e.target===modal)close()});modal.querySelector('.modal-inner').addEventListener('click',e=>e.stopPropagation());modal.querySelector('.modal-close').addEventListener('click',close);document.addEventListener('keydown',esc);document.body.appendChild(modal)}

document.addEventListener('click',e=>{
  const session=e.target.closest('.session[data-session-id]');
  if(session){selectedSession=session.dataset.sessionId;document.querySelectorAll('.session[data-session-id]').forEach(s=>s.classList.toggle('active',s.dataset.sessionId===selectedSession));applyFilters();return}
  const preview=e.target.closest('[data-preview-url]');
  if(preview){if(e.target.closest('video')&&(e.target.tagName==='VIDEO'||e.target.closest('video[controls]')))return;e.stopPropagation();openModal(preview.dataset.previewUrl,preview.tagName==='VIDEO');return}
  const action=e.target.closest('[data-action]');const message=e.target.closest('.message');
  if(action&&message){if(action.dataset.action==='download'){const media=message.querySelector('[data-preview-url]');if(media)window.open(media.dataset.previewUrl,'_blank')}if(action.dataset.action==='retry'){loadTaskForRetry(tasksCache.get(String(message.dataset.taskId)))}}
});

initAuth();
window.addEventListener('beforeunload',()=>{clearTimeout(pollTimer);clearTimeout(healthTimer)});
</script>
</body>
